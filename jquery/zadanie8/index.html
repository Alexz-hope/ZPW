<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" 
    crossorigin="anonymous"></script>
     <style>
        .podswietlony{background-color: yellow;}
    </style>
    <script>
        $(function(){
            $("#zmien").click(function(){
                $("#tekst").text("nowy tekst")
            })

            $("#zmiena2").on("click", function(){
                $("#box").toggle()
            })

            $(".akapit").click(function(){
                $(this).toggleClass("podswietlony");
            })




            $("#przywitaj").click(function(){
                let $imie = $("#imie").val()
                if($imie !=""){
                   $("#wynik").text("czesc" + $imie)
                } else {
                     $("#wynik").text("podaj imie")
                }
                }
            )
        })


        

        
    </script>
    
</head>
<body>
    <p id="tekst">stary tekst</p>
    <button id="zmien">zmien</button>

    <div id="box">box</div>
    <button id="zmiena2">div</button>

    <p class="akapit">kliikni mn</p>

    <input type="text" id="imie">
    <button id="przywitaj">przywitaj</button>
    <p id="wyink"></p>
</body>
</html>
