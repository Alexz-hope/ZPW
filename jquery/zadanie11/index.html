    crossorigin="anonymous"></script>

<script>
    $(function(){
$("#formularz").submit(function(e){
    e.preventDefault();
    if($("#nick").val() === ""){
        $("#info").text("podaj nick")
    }else {
      $("#info").text("przesłano:" + $("#nick").val())  
    }
    if($("#haslo").val() !== 6){
        $("#info").text("haslo jest za krutkie").css("background-color","red")
    } else{
         $("#info").text("zalogowano").css("background-color","green")
    }
})
})
      
</script>

<body>
    <form id="formularz">
        <input type="text" id="nick">nick
        <br>
        <input type="text"  id="email">email
        <br>
        <input type="text"  id="haslo">haslo
        <br>
        <button type="submit">wyslij</button>
    </form>
    <p id="info"></p>
</body>
