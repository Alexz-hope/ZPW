<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" 
    crossorigin="anonymous"></script>
</head>
<script>
    $(function(){
let positionX = 0
let positionY = 0
        $(document).on("keydown",function(){
            
            if(event.key =="a"){
                positionX = positionX - 10;
                $("#kwadrat").css("margin-left",positionX+"px")
            }
            if(event.key =="d"){
                positionX = positionX + 10;
                $("#kwadrat").css("margin-left",positionX+"px")
            }
            if(event.key =="w"){
                positionY = positionY - 10;
                $("#kwadrat").css("margin-top",positionY+"px")
            }
            if(event.key =="s"){
                positionY = positionY + 10;
                $("#kwadrat").css("margin-top",positionY+"px")
            }

        })
         $("#jablko").css({
            "margin-left": Math.floor((Math.random()* 500)+1) + "px",
            "margin-top": Math.floor((Math.random()* 500)+1) + "px"
         })

            })
</script>
<style>
    #kwadrat{
        background-color: red;
        height: 100px;
        width: 100px;
        position: absolute;
    }
    #jablko{
        height: 20px;
        width: 20px;
        background-color: green;
    }
</style>
<body>
    <input type="text" id="pole">
    <p>
    typ zdarzen:
    <span id="eventtype"></span>
    </p>
    <p>
        pozycja myszy
        x = <span id="pagex">---</span>
        y = <span id="pagey">---</span>
    </p>
    <div id="kwadrat"></div>
    <div id="jablko"></div>
</body>
</html>
